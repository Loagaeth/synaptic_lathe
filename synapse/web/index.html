<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SynapticLathe</title>
<link rel="stylesheet" href="/web/styles.css">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
</head>
<body>
<nav>
  <h2>SynapticLathe</h2>
  <a class="active" data-tab="overview"><span class="dot" id="status-dot"></span>概览</a>
  <a data-tab="agents">Agents</a>
  <a data-tab="tasks">任务</a>
  <a data-tab="memories">记忆</a>
  <a data-tab="skills">技能</a>
  <a data-tab="knowledge">知识</a>
  <a data-tab="personas">人设</a>
  <a data-tab="settings">设置</a>
  <a data-tab="logs">日志</a>
  <a data-tab="prompt">提示词</a>
  <a data-tab="install">安装</a>
  <div class="nav-actions">
    <button type="button" data-action="toggle-theme" id="theme-btn">日间模式</button>
    <button type="button" data-action="logout">清除认证</button>
  </div>
</nav>
<main id="main"></main>
<div id="toast" class="toast"></div>

<script src="/web/app.js"></script>
</body>
</html>
