# SynapticLathe 示例配置
# 复制为 config.yaml 后再填写真实密钥；不要提交 config.yaml。

router:
  # /send 未显式提供 target 时，按 rules 顺序匹配，最后使用 default_agent。
  default_agent: ""
  rules: []
  # - prefix: "/code"
  #   target: "local-dispatcher"
  # - keyword: "查资料"
  #   target: "search-agent"
  # 同一规则同时设置 prefix 和 keyword 时，两项都必须匹配。

# 这里只配置服务端主动调用的 HTTP adapter。
# Claude、Codex、Hermes、Reasonix 和任意本地命令使用独立 WebSocket worker，
# 由 profiles.example.yaml 或 synaptic-worker-setup 管理，不要在这里填写 cli_bridge。
agents:
  # astrbot:
  #   type: http_api
  #   base_url: "http://127.0.0.1:6185/api/v1/chat"
  #   api_key: "<astrbot-api-key>"
  #   stream: false
  #   extra:
  #     username: "SynapticLathe"
  #     config_name: "synaptic"
  #     provider: ""
  #     model: ""

server:
  host: "127.0.0.1"
  port: 9112

  # 管理 API 密钥。仅在显式绑定 127.0.0.1/localhost/::1 时允许留空。
  api_key: ""
  # WebSocket worker 的低权限密钥。留空时为兼容旧配置而回退到 api_key。
  worker_api_key: ""

  cors_origins: ["http://127.0.0.1:9112"]
  behind_proxy: false
  # 支持单个 IP 或 CIDR；只信任会覆盖/追加 X-Forwarded-For 的代理。
  trusted_proxy_hosts: ["127.0.0.1", "::1"]
  public_read_context: false
  outbound_trust_env: false

  rate_limit_max: 60
  rate_limit_window: 60
  ws_rate_limit_max: 240
  ws_rate_limit_window: 60
  max_body_bytes: 1048576
  # receive_timeout 必须大于 ping_interval，否则连接会在首次心跳前断开。
  ws_receive_timeout: 60
  ws_ping_interval: 30
  pending_message_ttl_hours: 24
  task_history_hours: 168

  # 0 表示关闭。启用后只按 scope 保存 purpose=execute 且经过截断/脱敏的任务摘要。
  auto_memory_threshold: 0
  auto_memory_max_chars: 4000

memory:
  # shared（所有调用方共享）或 persona（必须显式提供 persona 才自动沉淀）。
  scope: shared

  # local | openai | gemini | nvidia | ollama
  embedding_provider: local
  embedding_model: ""
  # OpenAI-compatible provider 示例: https://api.openai.com/v1
  # Ollama 留空时默认使用 http://127.0.0.1:11434/api/embed。
  embedding_api_url: ""
  embedding_api_key: ""
  embedding_dimensions: 0
  embedding_timeout: 20
  embedding_trust_env: false

db_path: "data/synaptic_lathe.db"
